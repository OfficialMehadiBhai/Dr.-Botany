<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Library — Dr. Botany</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{display:['Playfair Display','serif'],body:['DM Sans','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="navbar-slot"></div>
  <div id="sidebar-slot"></div>

  <main class="page-wrapper">
    <div class="container section">
      <!-- হেডার -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="font-display text-3xl font-bold" style="color:var(--text-primary)">Books Library</h1>
          <p style="font-size:14px;color:var(--text-dim);margin-top:4px">Browse and download your textbooks</p>
        </div>
        <div class="search-box w-full sm:w-72">
          <i class="fas fa-search search-icon"></i>
          <input type="text" class="input" id="bookSearch" placeholder="Search books..." oninput="BooksPage.filter()">
        </div>
      </div>

      <!-- ক্যাটেগরি ফিল্টার -->
      <div class="flex flex-wrap gap-2 mb-6" id="bookFilters"></div>

      <!-- বই গ্রিড -->
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="booksGrid"></div>

      <!-- পেজিনেশন -->
      <div id="booksPagination"></div>
    </div>
    <div id="footer-slot"></div>
  </main>

  <div id="fab-slot"></div>

  <!-- PDF মডাল -->
  <div class="modal-overlay" id="pdfModal">
    <div class="modal-content" style="max-width:800px">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display text-lg font-bold" id="pdfTitle" style="color:var(--text-primary)">PDF Viewer</h3>
        <button onclick="closeModal('pdfModal')" class="btn-icon btn-ghost"><i class="fas fa-times"></i></button>
      </div>
      <div style="width:100%;height:60vh;border-radius:var(--radius-lg);background:var(--bg-primary);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center" id="pdfViewerContent">
        <div class="text-center">
          <i class="fas fa-file-pdf" style="font-size:48px;color:var(--green-400);margin-bottom:16px"></i>
          <p style="color:var(--text-secondary);font-weight:600">PDF Preview</p>
          <p style="color:var(--text-dim);font-size:13px;margin-top:4px">Connect Firebase Storage for real PDF viewing</p>
        </div>
      </div>
      <div class="flex gap-3 mt-4">
        <button class="btn btn-primary flex-1" id="pdfDownloadBtn"><i class="fas fa-download"></i>Download PDF</button>
        <button class="btn btn-secondary" onclick="closeModal('pdfModal')"><i class="fas fa-times"></i>Close</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pdf-config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => BooksPage.init());
    function openModal(id){document.getElementById(id).classList.add('show')}
    function closeModal(id){document.getElementById(id).classList.remove('show')}
  </script>
</body>
</html>
